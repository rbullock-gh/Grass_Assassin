name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  # A newer push supersedes an in-flight run on the same branch. Without this,
  # a busy branch queues runs that are already obsolete.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck and test
    runs-on: ubuntu-latest

    services:
      # PostGIS, not plain Postgres. The integration tests deliberately use a
      # real database because the behaviour under test — row-level locking
      # under concurrent conditional UPDATEs, and spatial radius search —
      # exists only inside Postgres. A mock would assert nothing about either.
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: grass
          POSTGRES_PASSWORD: grass
          POSTGRES_DB: grassassassin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U grass"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://grass:grass@localhost:5432/grassassassin_test
      JWT_ACCESS_SECRET: ci-access-secret-at-least-32-characters-long
      JWT_REFRESH_SECRET: ci-refresh-secret-at-least-32-characters-long
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      # No `version:` here on purpose. package.json's `packageManager` field is
      # the single source of truth; specifying both makes the action fail with
      # "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @grassassassin/api db:generate

      - name: Apply migrations
        run: pnpm --filter @grassassassin/api db:deploy

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm -r test

      - name: Bundle the mobile app
        # Typecheck and the unit suite both pass straight over a bundler
        # failure, because neither of them runs the bundler. The app was at one
        # point unbundleable — Metro could not resolve the workspace packages'
        # ESM ".js" specifiers — while every other check was green, so this step
        # exists specifically to catch that class of break.
        env:
          # Overrides the job-wide NODE_ENV=test, which the tests need and this
          # must not have: under "test", babel-preset-expo stops inlining
          # EXPO_ROUTER_APP_ROOT and every route fails to resolve. An export is
          # a production build in any case.
          #
          # Worth recording how this hid: with a warm Metro cache the already
          # transformed module is reused and the bundle succeeds, so it only
          # appears on a cold cache — which is every CI run and almost no local
          # one. Reproduced locally by clearing .expo before exporting.
          NODE_ENV: production
        run: pnpm --filter @grassassassin/mobile exec expo export --platform web --output-dir .expo-web-ci

      # Handed to the render job rather than bundled twice, so what gets
      # rendered is byte-for-byte what this step produced.
      - name: Keep the web bundle for the render job
        uses: actions/upload-artifact@v4
        with:
          name: web-bundle
          path: apps/mobile/.expo-web-ci
          retention-days: 1

      - name: Create shadow database
        run: |
          PGPASSWORD=grass createdb -h localhost -U grass grassassassin_shadow

      - name: Check migrations match the schema
        # Catches a schema.prisma edit that was never turned into a migration —
        # which passes every test locally and then fails on deploy. Checks for
        # STRUCTURAL drift only; see the script for why a plain
        # `migrate diff --exit-code` cannot be used here.
        env:
          SHADOW_DATABASE_URL: postgresql://grass:grass@localhost:5432/grassassassin_shadow
        run: bash scripts/check-migration-drift.sh

  smoke:
    name: End-to-end smoke test
    runs-on: ubuntu-latest
    needs: verify

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: grass
          POSTGRES_PASSWORD: grass
          POSTGRES_DB: grassassassin_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U grass"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://grass:grass@localhost:5432/grassassassin_smoke
      JWT_ACCESS_SECRET: ci-access-secret-at-least-32-characters-long
      JWT_REFRESH_SECRET: ci-refresh-secret-at-least-32-characters-long
      PORT: 4000

    steps:
      - uses: actions/checkout@v4
      # No `version:` here on purpose. package.json's `packageManager` field is
      # the single source of truth; specifying both makes the action fail with
      # "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @grassassassin/api db:generate
      - run: pnpm --filter @grassassassin/api db:deploy
      - run: pnpm --filter @grassassassin/api db:seed

      - name: Start the API
        run: |
          pnpm --filter @grassassassin/api dev > /tmp/api.log 2>&1 &
          for _ in $(seq 1 40); do
            curl -sf http://localhost:4000/health > /dev/null && break
            sleep 1
          done
          curl -sf http://localhost:4000/health || { cat /tmp/api.log; exit 1; }

      - name: Drive the full marketplace loop
        run: bash scripts/smoke-test.sh

      - name: API log
        if: failure()
        run: cat /tmp/api.log

  admin:
    name: Admin dashboard in a browser
    runs-on: ubuntu-latest
    needs: verify

    # The admin dashboard is the one surface that can change platform fees and
    # settle disputes, and almost everything that protects it is only true in a
    # browser: whether the middleware is wired to the routes, whether the cookie
    # carries httpOnly, whether a revoked administrator actually loses access.
    # Unit tests cannot answer any of those, so CI asks a browser.
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: grass
          POSTGRES_PASSWORD: grass
          POSTGRES_DB: grassassassin_admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U grass"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://grass:grass@localhost:5432/grassassassin_admin
      JWT_ACCESS_SECRET: ci-access-secret-at-least-32-characters-long
      JWT_REFRESH_SECRET: ci-refresh-secret-at-least-32-characters-long
      ADMIN_SESSION_SECRET: ci-admin-session-secret-at-least-32-chars
      ADMIN_SERVICE_TOKEN: ci-admin-service-token-at-least-32-chars-x
      ADMIN_EMAIL: admin@grassassassin.test
      ADMIN_PASSWORD: ci-admin-password-not-a-real-secret
      API_BASE_URL: http://localhost:4000
      ADMIN_BASE_URL: http://localhost:3001
      PORT: 4000

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @grassassassin/api db:generate
      - run: pnpm --filter @grassassassin/api db:deploy
      - run: pnpm --filter @grassassassin/api db:seed

      - name: Create the administrator the suites sign in as
        run: pnpm --filter @grassassassin/api admin:create

      - run: pnpm exec playwright install --with-deps chromium

      - name: Start the API
        run: |
          pnpm --filter @grassassassin/api dev > /tmp/api.log 2>&1 &
          for _ in $(seq 1 40); do
            curl -sf http://localhost:4000/health > /dev/null && break
            sleep 1
          done
          curl -sf http://localhost:4000/health || { cat /tmp/api.log; exit 1; }

      # Built and served as production, not dev. The secure cookie flag and the
      # edge middleware only behave like production in a production build.
      - name: Build and start the admin dashboard
        run: |
          pnpm --filter @grassassassin/admin build
          pnpm --filter @grassassassin/admin start > /tmp/admin.log 2>&1 &
          for _ in $(seq 1 40); do
            curl -sf -o /dev/null http://localhost:3001/sign-in && break
            sleep 1
          done
          curl -sf -o /dev/null http://localhost:3001/sign-in || { cat /tmp/admin.log; exit 1; }

      # The claim is that a missing secret is a fatal misconfiguration rather
      # than a quiet fallback to open access. Checked on its own instance, on a
      # different port, before the real one starts.
      - name: It refuses to run unauthenticated in production
        run: |
          env -u ADMIN_SESSION_SECRET \
            pnpm --filter @grassassassin/admin exec next start -p 3002 > /tmp/noauth.log 2>&1 &
          sleep 8
          code=$(curl -s -o /tmp/noauth-body.html -w '%{http_code}' http://localhost:3002/config || true)
          if [ "$code" != "500" ]; then
            echo "::error::Expected 500 with no ADMIN_SESSION_SECRET, got $code"
            cat /tmp/noauth.log
            exit 1
          fi
          if grep -qE 'Fees & config|worker_commission' /tmp/noauth-body.html; then
            echo "::error::Admin content leaked while unauthenticated."
            exit 1
          fi
          grep -q 'ADMIN_SESSION_SECRET is required' /tmp/noauth.log || {
            echo "::error::Expected the refusal to say why."; cat /tmp/noauth.log; exit 1;
          }
          pkill -f 'next start -p 3002' || true
          echo "Refused to serve without a session secret, and leaked nothing."

      - name: Nothing is reachable without signing in
        run: node scripts/admin-auth-check.mjs

      - name: A revoked administrator loses access immediately
        run: node scripts/admin-revocation-check.mjs

      # Needs an open dispute, or the decision form the render check exists to
      # look at is simply not on the page. The script fails rather than passing
      # quietly if it is missing.
      - name: Open a dispute for the render check to draw
        run: pnpm --filter @grassassassin/api exec tsx prisma/open-dispute.ts

      - name: Every admin page at every width, in both themes
        run: node scripts/admin-render-check.mjs

      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-screenshots
          path: .render-check-admin
          retention-days: 7
          if-no-files-found: ignore

      # Last: it deliberately leaves an address blocked in the server's memory.
      - name: Guessing the password is throttled, without locking anyone out
        run: node scripts/admin-bruteforce-check.mjs

      - name: Logs
        if: failure()
        run: |
          echo '--- api ---'; cat /tmp/api.log
          echo '--- admin ---'; cat /tmp/admin.log

  render:
    name: Every screen in a real browser
    runs-on: ubuntu-latest
    needs: verify

    # Three of the worst defects this project has had were invisible to
    # typecheck and to the entire unit suite: the app could not bundle at all,
    # every text style overlapped because a line height was a CSS ratio where
    # React Native wanted points, and a balance rounded up. All three were
    # obvious the moment something drew them. Rendering finds what reading
    # cannot, so it runs here rather than only on somebody's laptop.
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: grass
          POSTGRES_PASSWORD: grass
          POSTGRES_DB: grassassassin_render
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U grass"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://grass:grass@localhost:5432/grassassassin_render
      JWT_ACCESS_SECRET: ci-access-secret-at-least-32-characters-long
      JWT_REFRESH_SECRET: ci-refresh-secret-at-least-32-characters-long
      PORT: 4000
      APP_URL: http://localhost:4311
      API_URL: http://localhost:4000/v1

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @grassassassin/api db:generate
      - run: pnpm --filter @grassassassin/api db:deploy
      - run: pnpm --filter @grassassassin/api db:seed

      - run: pnpm exec playwright install --with-deps chromium

      - name: Fetch the web bundle built by verify
        uses: actions/download-artifact@v4
        with:
          name: web-bundle
          path: apps/mobile/.expo-web-ci

      - name: Start the API
        run: |
          pnpm --filter @grassassassin/api dev > /tmp/api.log 2>&1 &
          for _ in $(seq 1 40); do
            curl -sf http://localhost:4000/health > /dev/null && break
            sleep 1
          done
          curl -sf http://localhost:4000/health || { cat /tmp/api.log; exit 1; }

      - name: Serve the web build
        run: |
          node scripts/serve-web.mjs apps/mobile/.expo-web-ci > /tmp/web.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:4311/ && break
            sleep 1
          done
          curl -sf -o /dev/null http://localhost:4311/ || { cat /tmp/web.log; exit 1; }

      - name: Render every screen at every size
        run: node scripts/render-check.mjs

      - name: Logs
        if: failure()
        run: |
          echo '--- api ---'; cat /tmp/api.log
          echo '--- web ---'; cat /tmp/web.log

  images:
    name: Build the container images and run them
    runs-on: ubuntu-latest
    needs: verify

    # These were written without a container runtime available, so until this
    # job runs they are reasoning rather than fact. Building them is half the
    # check; the other half is starting the API image and driving the whole
    # marketplace through it, because an image that builds and cannot serve is
    # not obviously better than one that does not build.
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: grass
          POSTGRES_PASSWORD: grass
          POSTGRES_DB: grassassassin_images
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U grass"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://grass:grass@localhost:5432/grassassassin_images

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Build the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          tags: grassassassin-api:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build the admin image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/admin/Dockerfile
          tags: grassassassin-admin:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # host.docker.internal is not a thing on a Linux runner, so the
      # containers join the host's network namespace and reach postgres on
      # localhost the same way the runner does.
      - name: Migrate and seed with the image itself
        run: |
          docker run --rm --network host -e DATABASE_URL="$DATABASE_URL" \
            grassassassin-api:ci npx prisma migrate deploy --schema prisma/schema.prisma
          pnpm install --frozen-lockfile
          pnpm --filter @grassassassin/api db:generate
          pnpm --filter @grassassassin/api db:seed

      - name: The API image serves the whole marketplace
        run: |
          docker run -d --name api --network host \
            -e DATABASE_URL="$DATABASE_URL" \
            -e PORT=4000 \
            -e JWT_ACCESS_SECRET=ci-access-secret-at-least-32-characters-long \
            -e JWT_REFRESH_SECRET=ci-refresh-secret-at-least-32-characters-long \
            grassassassin-api:ci
          for _ in $(seq 1 40); do
            curl -sf http://localhost:4000/health > /dev/null && break
            sleep 1
          done
          curl -sf http://localhost:4000/health || { docker logs api; exit 1; }
          bash scripts/smoke-test.sh

      - name: The image can create the first administrator
        run: |
          docker run --rm --network host -e DATABASE_URL="$DATABASE_URL" \
            grassassassin-api:ci node dist/admin-create.js \
              --email admin@grassassassin.test \
              --password ci-admin-password-not-a-real-secret \
              --name 'CI Admin'

      - name: The admin image serves, and is locked
        run: |
          docker run -d --name admin --network host \
            -e DATABASE_URL="$DATABASE_URL" \
            -e PORT=3001 \
            -e ADMIN_SESSION_SECRET=ci-admin-session-secret-at-least-32-chars \
            -e API_BASE_URL=http://localhost:4000 \
            -e ADMIN_SERVICE_TOKEN=ci-admin-service-token-at-least-32-chars-x \
            grassassassin-admin:ci
          for _ in $(seq 1 40); do
            curl -sf -o /dev/null http://localhost:3001/sign-in && break
            sleep 1
          done
          curl -sf -o /dev/null http://localhost:3001/sign-in || { docker logs admin; exit 1; }
          pnpm exec playwright install --with-deps chromium
          ADMIN_EMAIL=admin@grassassassin.test \
          ADMIN_PASSWORD=ci-admin-password-not-a-real-secret \
            node scripts/admin-auth-check.mjs --base http://localhost:3001

      - name: Container logs
        if: failure()
        run: |
          docker logs api 2>&1 || true
          docker logs admin 2>&1 || true
